<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0d13">
<title>扫码点歌</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>🎤 现场点歌</h1>
    <p class="sub">从下面的歌单里挑一首，主播马上安排</p>
  </header>

  <section class="card now" id="now">
    <span class="label"><span class="dot"></span>正在演唱</span>
    <p class="idle" id="nowIdle">还没开始，先来点一首吧</p>
    <div id="nowInfo" hidden>
      <div class="title" id="nowTitle"></div>
      <div class="artist" id="nowArtist"></div>
    </div>
  </section>

  <div class="statusbar">
    <span id="openBadge" class="badge">点歌开放中</span>
    <span id="waitInfo">前面还有 0 首</span>
  </div>

  <div id="mineWrap" hidden>
    <div class="section-title">我点的歌</div>
    <div class="mine" id="mine"></div>
  </div>

  <div class="section-title">
    <span>今日歌单</span>
    <span class="conn" id="conn"><span class="dot"></span><span id="connText">已连接</span></span>
  </div>

  <div class="search">
    <input type="search" id="q" placeholder="搜歌名或歌手…" autocomplete="off">
  </div>
  <div class="chips" id="chips"></div>

  <div class="songlist" id="songs"></div>
  <div class="empty" id="noResult" hidden>没有找到这首歌</div>

  <section class="card tip" id="tipCard" hidden>
    <div class="tip-head">☕ 觉得好听？请歌手喝杯东西</div>
    <img id="tipImg" src="/tip.png" alt="打赏收款码">
    <p class="tip-note">长按识别或截图扫码，打赏直接进歌手个人账户</p>
  </section>

  <footer class="note">
    点歌后会进入队列，主播按顺序演唱。每人最多同时排 2 首。
  </footer>
</div>

<div class="mask" id="mask">
  <div class="sheet">
    <h3>点这首歌</h3>
    <p class="pick" id="pickName">—</p>
    <div class="field">
      <label for="nick">怎么称呼你（选填）</label>
      <input type="text" id="nick" maxlength="20" placeholder="匿名朋友" autocomplete="off">
    </div>
    <div class="field">
      <label for="msg">想说的话（选填）</label>
      <textarea id="msg" rows="2" maxlength="60" placeholder="比如：送给今天过生日的小王"></textarea>
    </div>
    <div class="row">
      <button class="btn-ghost" id="cancelBtn" type="button">取消</button>
      <button class="btn-primary" id="sendBtn" type="button">确认点歌</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
